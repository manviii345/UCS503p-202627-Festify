  <!-- Outer Perforated Stamp Border -->
  <rect x="32" y="32" width="448" height="448" fill="#efe3c8" rx="24" stroke="#c23b32" stroke-width="8" stroke-dasharray="16 12"/>
  
  <!-- Stamp Inner Box -->
  <rect x="56" y="56" width="400" height="400" fill="#c23b32" rx="16" stroke="#152b38" stroke-width="6"/>
  
  <!-- Stamp Inner Details -->
